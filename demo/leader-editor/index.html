<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leader editor · ViewLeader examples</title>
    <style>
      /* Editor chrome is the host's, so it lives with the page rather than in the shared stylesheet.
         Everything is positioned inside #viewport, whose pixel coordinates are the ones
         `geometry.of` reports. */
      .host-text-field {
        position: absolute;
        z-index: 20;
        margin: 0;
        border: 1px solid #4b6ef5;
        border-radius: 2px;
        outline: 2px solid rgb(75 110 245 / 25%);
        background: #fff;
        resize: none;
        overflow: hidden;
      }

      /* An armed tool. Core owns the pointer for the length of the session, so the only job left
         here is telling the user which tool has it. */
      .control-bar button[aria-pressed='true'] {
        border-color: #4b6ef5;
        background: #4b6ef5;
        color: #fff;
      }

      /* The live multi-point leader, between the click that started it and the one that ends it.
         Core publishes the vertices; nothing draws them for you. */
      .vl-authoring-preview {
        position: absolute;
        inset: 0;
        z-index: 15;
        pointer-events: none;
        overflow: visible;
      }
    </style>
  </head>
  <body>
    <header class="example-header">
      <div><a href="/">← Examples</a><strong>Leader editor</strong></div>
      <a href="/src/pages/leader-editor.ts.txt">View source</a>
    </header>
    <main id="viewport" aria-label="Three.js viewport"></main>
    <script type="module" src="/src/pages/leader-editor.ts"></script>
  </body>
</html>
