<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Host chrome · ViewLeader examples</title>
    <style>
      /* The chrome is the host's, so its styling lives with the host page rather than in the
         shared example stylesheet. Both widgets are positioned inside #viewport, whose pixel
         coordinates are the ones `geometry.of` reports. */
      .host-menu {
        position: absolute;
        z-index: 20;
        display: flex;
        flex-direction: column;
        min-width: 176px;
        padding: 5px;
        border: 1px solid #b9b5aa;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 12px 32px rgb(35 38 45 / 18%);
      }
      .host-menu button {
        font: inherit;
        font-size: 13px;
        text-align: left;
        padding: 7px 10px;
        border: 0;
        border-radius: 6px;
        background: none;
        color: #1a1d24;
        cursor: pointer;
      }
      .host-menu button:hover { background: #eceae3; }

      .host-text-field {
        position: absolute;
        z-index: 20;
        margin: 0;
        border: 1px solid #4b6ef5;
        border-radius: 2px;
        outline: 2px solid rgb(75 110 245 / 25%);
        background: #fff;
        resize: none;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <header class="example-header">
      <div><a href="%BASE_URL%">← Examples</a><strong>Host chrome</strong></div>
      <a href="%BASE_URL%src/pages/host-chrome.ts.txt">View source</a>
    </header>
    <main id="viewport" aria-label="Three.js viewport"></main>
    <script type="module" src="/src/pages/host-chrome.ts"></script>
  </body>
</html>
